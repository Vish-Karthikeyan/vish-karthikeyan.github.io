  - heading: "University Service"
    entries:

      - title: "Faculty Senate Committee on Undergraduate Admission and Financial Aid (C-UAFA)"
        roles:
          - "Student Representative · 2026–27"
        description: |
          I serve as one of three undergraduate members of the committee, which advises on institution-wide admission and financial aid policy. Our work spans the criteria and weighting for special-consideration categories, recruitment and outreach to low-income and underrepresented applicants, and the standards governing financial aid—in direct engagement with the Dean of Admission and Financial Aid and senior university administration.

          While committee proceedings are confidential, if you believe there is an issue that must be discussed formally, please [reach out](mailto:vkarthikeyan@stanford.edu).

      - title: "Subcommittee on AI in Undergraduate Admissions"
        roles:
          - "Student Representative · 2026–27"
