# ===========================================================================
# RESEARCH PAGE  (shown at /research/)
#
# The page is a list of sections; each section has a heading and items.
# Items appear in the order written here. To add a project, copy an existing
# item (everything from its "- title:" line down to the next "- title:") and
# edit it. Fields you don't need can simply be deleted.
#
# Fields for each item:
#   title:          Bold title.
#   title_full:     (optional) Italic text shown after the title, e.g. the
#                   full name of an acronym.
#   image:          Thumbnail. Either a full URL (https://...) or a file in
#                   the repo, e.g. /assets/images/research/my-image.jpg
#   image_link:     (optional) Where clicking the thumbnail goes. Defaults to
#                   the image itself.
#   tile:           (optional) Text shown on a cardinal tile when there is no
#                   image.
#   subtitle:       (optional) Grey line under the title (e.g. course name).
#   supervisors:    (optional) List of { name, url, affiliation }.
#   description:    Paragraph(s). Markdown allowed: *italic*, **bold**,
#                   [link text](https://...). Leave a blank line between
#                   paragraphs.
#   aims_intro / aims:   (optional) Sentence + list shown as (i), (ii), ...
#   current_work:   (optional) { title, description }
#   status:         (optional) Italic grey line, e.g. "Paper forthcoming."
#   buttons:        (optional) Small buttons: list of { label, url }
#   center_button:  (optional) One larger centred button at the bottom of the
#                   box: { label, url }
#
# Email links look like:  mailto:vkarthikeyan@stanford.edu?subject=Hello
# (spaces in the subject are written as %20)
# ===========================================================================

