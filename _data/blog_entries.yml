  - section: "The Stanford Political Review"
    title: "The Need for a Universal Minimum Age for Gender-Affirming Surgery"
    publication: "Stanford Political Review"
    date: "March 10, 2026"
    instagram_url: "https://www.instagram.com/p/DVt4KMDEp_j/"
    article_url: "https://stanfordpoliticalreview.org/2026/03/10/the-need-for-a-universal-minimum-age-for-gender-affirming-surgery/"
    notes: >
      In this piece, I examine whether a universal minimum age could provide a more consistent legal and ethical baseline for gender-affirming surgery. I was especially interested in the tension between individual autonomy, medical discretion, and the state's role in setting uniform thresholds.
