  - { title: "Research",                        url: "/research/" }
  - { title: "Discourse, Teaching and Service", url: "/discourse/" }
  - { title: "Writing",                         url: "/writing/" }

# Résumé link (right side of the navigation bar). Replace resume.pdf to update.
resume: "/resume.pdf"

# Icons at the far right of the navigation bar.
social:
  github:   "https://github.com/vish-karthikeyan"
  linkedin: "https://www.linkedin.com/in/viswajeeth-karthikeyan/"

plugins:
  - jekyll-feed
  - jekyll-redirect-from

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - UNLICENSE.txt
  - CLAUDE.md
  - claude.md
