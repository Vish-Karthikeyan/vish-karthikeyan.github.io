title: "Vish Karthikeyan"
author: "Vish Karthikeyan"
description: "Vish Karthikeyan — Stanford University, Computer Science and Public Policy. Research on agentic AI, technology policy and constitutional law."
url: "https://vish-karthikeyan.github.io"
lang: "en"
encoding: "utf-8"
permalink: /:title/

email: "vkarthikeyan@stanford.edu"
copyright_name: "Vish Karthikeyan"

# Top navigation bar, in order. `url` is the page address.
